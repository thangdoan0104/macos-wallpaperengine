name: Build w4
on:
  push:
    branches: [w4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-w4
  cancel-in-progress: true
env:
  OFFICIAL_DMG: https://github.com/Paradox07127/macos-wallpaperengine/releases/download/loomscreen-v1.0.1/Loomscreen-Pro-1.0.1.dmg
  OFFICIAL_SHA256: b0fc5f14f7d0ab90475508d359a66532e607836386ae0f876b9b38badb7a0f09
  UPSCALER_ZIP: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-macos.zip
  UPSCALER_SHA256: e0ad05580abfeb25f8d8fb55aaf7bedf552c375b5b4d9bd3c8d59764d2cc333a
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers
          xcodebuild SWIFT_EMIT_LOC_STRINGS=NO -downloadComponent MetalToolchain
      - name: Signing identity
        env:
          P12: ${{ secrets.W4_SIGN_P12 }}
          PW: ${{ secrets.W4_SIGN_PW }}
        run: |
          if [ -z "$P12" ] || [ -z "$PW" ]; then
            echo "W4_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::Không có chứng chỉ, dùng chữ ký tạm"
            exit 0
          fi
          KC="$RUNNER_TEMP/w4.keychain-db"
          security create-keychain -p w4 "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p w4 "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/w4.p12"
          security import "$RUNNER_TEMP/w4.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k w4 "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "w4llpapr Local Signing" -p "$KC" > "$RUNNER_TEMP/w4.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/w4.pem"
          ID=$(openssl x509 -in "$RUNNER_TEMP/w4.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          echo "W4_IDENTITY=$ID" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"
      - name: Official shader helper
        run: |
          curl -fsSL -o official.dmg "$OFFICIAL_DMG"
          echo "$OFFICIAL_SHA256  official.dmg" | shasum -a 256 -c -
          hdiutil attach official.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/official"
          OFFICIAL="$RUNNER_TEMP/official/Loomscreen Pro.app"
          mkdir -p "$RUNNER_TEMP/helper"
          cp "$OFFICIAL/Contents/MacOS/wpe-shaderc" "$OFFICIAL/Contents/Frameworks/libdxcompiler.dylib" "$OFFICIAL/Contents/Frameworks/libmetalirconverter.dylib" "$RUNNER_TEMP/helper/"
          codesign -d --entitlements :- "$OFFICIAL/Contents/MacOS/wpe-shaderc" > "$RUNNER_TEMP/helper.entitlements" 2>/dev/null || true
          cat "$RUNNER_TEMP/helper.entitlements"
          mkdir -p "$RUNNER_TEMP/helper/notices"
          ditto "$OFFICIAL/Contents/Resources/WPEShaderCompilerNotices" "$RUNNER_TEMP/helper/notices"
          (cd "$OFFICIAL" && find Contents -maxdepth 3 -not -path '*/Resources/*' | sort) > official-tree.txt
          hdiutil detach "$RUNNER_TEMP/official"
      - name: Upscaler
        run: |
          curl -fsSL -o upscaler.zip "$UPSCALER_ZIP"
          echo "$UPSCALER_SHA256  upscaler.zip" | shasum -a 256 -c -
          U="$RUNNER_TEMP/upscaler"
          mkdir -p "$U/models"
          unzip -q upscaler.zip realesrgan-ncnn-vulkan 'models/realesrgan-x4plus*' -d "$U"
          curl -fsSL -o "$U/LICENSE-Real-ESRGAN.txt" https://raw.githubusercontent.com/xinntao/Real-ESRGAN/v0.2.5.0/LICENSE
          chmod +x "$U/realesrgan-ncnn-vulkan"
          ls -la "$U" "$U/models"
          cat > "$RUNNER_TEMP/upscaler.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.app-sandbox</key><true/>
          <key>com.apple.security.inherit</key><true/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/upscaler.entitlements"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project LiveWallpaper.xcodeproj -scheme LiveWallpaper -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="$W4_IDENTITY" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= ENABLE_HARDENED_RUNTIME=NO SWIFT_EMIT_LOC_STRINGS=NO W4_SKIP_SHADER_EMBED=1 \
            > build.log 2>&1 || { grep -nE 'error:|BUILD FAILED' build.log | head -80; tail -40 build.log; exit 1; }
          tail -3 build.log
      - name: Package
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release/*.app | head -1)
          echo "built: $APP"
          H="$RUNNER_TEMP/helper"
          mkdir -p "$APP/Contents/Frameworks"
          cp "$H/libdxcompiler.dylib" "$H/libmetalirconverter.dylib" "$APP/Contents/Frameworks/"
          cp "$H/wpe-shaderc" "$APP/Contents/MacOS/"
          ditto "$H/notices" "$APP/Contents/Resources/WPEShaderCompilerNotices"
          codesign -f -s "$W4_IDENTITY" "$APP/Contents/Frameworks/libdxcompiler.dylib" "$APP/Contents/Frameworks/libmetalirconverter.dylib"
          if [ -s "$RUNNER_TEMP/helper.entitlements" ]; then
            codesign -f -s "$W4_IDENTITY" --entitlements "$RUNNER_TEMP/helper.entitlements" "$APP/Contents/MacOS/wpe-shaderc"
          else
            codesign -f -s "$W4_IDENTITY" "$APP/Contents/MacOS/wpe-shaderc"
          fi
          ditto "$RUNNER_TEMP/upscaler" "$APP/Contents/Resources/Upscaler"
          codesign -f -s "$W4_IDENTITY" --entitlements "$RUNNER_TEMP/upscaler.entitlements" "$APP/Contents/Resources/Upscaler/realesrgan-ncnn-vulkan"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/app.entitlements" 2>/dev/null
          codesign -f -s "$W4_IDENTITY" --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          codesign -d -r- "$APP" 2>&1 | tail -2
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -5 || true
          (cd "$APP" && find Contents -maxdepth 3 -not -path '*/Resources/*' | sort) > built-tree.txt
          diff official-tree.txt built-tree.txt || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" w4llpapr.zip
          shasum -a 256 w4llpapr.zip
          ls -la w4llpapr.zip
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" w4llpapr.zip official-tree.txt built-tree.txt --draft --target "$GITHUB_SHA" --title "$TAG" --notes "Bản build thử."
